name: Hourly K-water Crawler

on:
  schedule:
    # 매시 정각(60분 주기) 자동 실행
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub 웹/모바일에서 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run crawler (1회 수집 및 HTML/JSON 갱신)
        env:
          KWATER_ID: ${{ secrets.KWATER_ID }}
          KWATER_PW: ${{ secrets.KWATER_PW }}
        run: node crawler.js

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/index.html sub/dashboard.html sub/data.json
          git diff --staged --quiet || git commit -m "chore: update realtime power dashboard"
          git push
