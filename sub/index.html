<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아시아 해외여행 플래너 (대구·부산 출발)</title>
  <script>
    // GitHub Pages 서브디렉터리 접근 시 끝자리 슬래시(/) 누락으로 인한 CSS/JS/JSON 404 깨짐 자동 방지
    if (!window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
      window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
    }
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
          <div class="header-title">
            <span>✈</span>
            <span>동아시아 해외여행 플래너 (대구·부산 출발)</span>
          </div>
          <div class="header-desc">
            스카이스캐너(Skyscanner) 항공권 실시간 최저가 TOP 3 및 서울외국환중개(SMBS) 오늘 환율 실시간 연동 (data.json 기반)
          </div>
        </div>

        <div style="display:flex; gap:8px; align-items:center;">
          <button id="btn-refresh-data" onclick="reloadRealtimeData()" style="padding:8px 14px; background:#2563eb; color:#ffffff; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
            <span>🔄 data.json 실시간 새로고침</span>
          </button>
          <a href="./data.json" target="_blank" style="padding:7px 12px; background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; border-radius:8px; font-size:12px; font-weight:600; text-decoration:none;">
            JSON 원본 보기 ↗
          </a>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button id="tab-flights" class="tab-btn active" onclick="switchTab('flights')">1. 항공권 금액분석 (TOP 3 & 과거 1년)</button>
      <button id="tab-currency" class="tab-btn" onclick="switchTab('currency')">2. 각 국가별 환율 그래프 (최근 1달)</button>
      <button id="tab-itinerary" class="tab-btn" onclick="switchTab('itinerary')">3. 여행계획 & 맛집 추천</button>
      <button id="tab-news" class="tab-btn" onclick="switchTab('news')">4. 여행관련 뉴스 및 기상정보</button>
    </div>

    <!-- Main Content Area -->
    <div id="tab-content">
      <!-- Dynamic rendering via app.js with real-time data.json -->
      <div style="padding:40px; text-align:center; color:#64748b; font-size:14px;">
        실시간 크롤링 데이터(./data.json)를 불러오는 중입니다...
      </div>
    </div>

    <div class="footer">
      © 2026 동아시아 해외여행 플래너 · 대구(TAE)·부산(PUS) 출발 맞춤 · 실시간 data.json 연동 시스템
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
