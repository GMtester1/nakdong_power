        el.classList.add('text-slate-300');
      });

      const activeView = document.getElementById(`view-${tabName}`);
      if (activeView) activeView.classList.remove('hidden');

      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
        activeBtn.classList.remove('text-slate-300');
      }

      renderView();
    }

    function selectCity(cityId) {
      state.cityId = cityId;
      generateItinerary();
      renderCityBar();
      renderView();
      showToast(`📍 여행지가 '${getCurrentCity().nameKo}'(으)로 변경되었습니다.`);
    }

    function setDepartureAirport(airport) {
      state.departureAirport = airport;
      const taeBtn = document.getElementById('btn-dep-tae');
      const pusBtn = document.getElementById('btn-dep-pus');

      if (airport === 'TAE') {
        taeBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md';
        pusBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-700/60';
      } else {
        pusBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md';
        taeBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-300 hover:text-white hover:bg-slate-700/60';
      }

      generateItinerary();
      renderView();
      showToast(`✈️ 출발 공항이 '${airport === 'TAE' ? '대구공항 (TAE)' : '부산 김해공항 (PUS)'}'(으)로 설정되었습니다.`);
    }

    function getCurrentCity() {
      return CITIES.find(c => c.id === state.cityId) || CITIES[0];
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-message');
      const text = document.getElementById('toast-text');
      text.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    }

    function saveRecordsToLocalStorage() {
      try {
        localStorage.setItem('travelmate_vanilla_records', JSON.stringify(state.savedRecords));
      } catch (e) {
        console.error(e);
      }
    }

    /* ========================================================
       4. ITINERARY GENERATOR ENGINE
       ======================================================== */
    function generateItinerary() {
      const city = getCurrentCity();
      const depName = state.departureAirport === 'TAE' ? '대구공항 (TAE)' : '부산 김해공항 (PUS)';
      const flightKey = `${state.departureAirport}_${state.cityId}`;
      const flight = FLIGHTS[flightKey];
      const weather = WEATHER[state.cityId] || WEATHER.fukuoka;
      const cityFoods = RESTAURANTS.filter(r => r.cityId === state.cityId);

      const days = [];
      const numDays = state.itineraryDays;

      // Day 1
      days.push({
        dayNumber: 1,
        theme: `${city.nameKo} 도착 & 설레는 핵심 탐방`,
        area: '공항 ➔ 호텔 체크인 ➔ 중심가 핵심 스팟',
        budget: '약 45,000원 (식비/교통비)',
        items: [
          { time: '08:00 - 11:30', slot: '오전', title: `${depName} 출국 및 ${city.nameKo} 도착`, loc: `${depName} ➔ ${city.nameEn} 공항`, desc: `${state.departureAirport === 'TAE' ? city.flightTimeFromTae : city.flightTimeFromPus} 비행 후 도착. 입국 수속 및 eSIM/교통카드 확인.`, tip: state.departureAirport === 'TAE' ? '대구공항은 수속 15분 컷으로 여유롭습니다.' : '김해공항은 사상역 경전철을 타면 정시 도착합니다.' },
          { time: '12:00 - 13:30', slot: '점심/오후', title: cityFoods[0] ? `${cityFoods[0].name} 식사` : '로컬 웰컴 런치', loc: cityFoods[0]?.addr || '시내 중심', desc: cityFoods[0] ? `시그니처: ${cityFoods[0].must}. ${cityFoods[0].tip}` : '현지 인기 로컬 식당에서 든든한 첫 점심.', tip: cityFoods[0]?.pay },
          { time: '14:30 - 17:00', slot: '늦은오후', title: `${city.highlights[0] || '도심 랜드마크'} 둘러보기`, loc: '시내 중심가', desc: `호텔 체크인 후 가벼운 차림으로 산책 및 인생샷 촬영. ${state.itineraryRainSafe ? '(우천시 실내 코스로 안전하게 전환됨)' : ''}`, tip: weather.indoor },
          { time: '18:00 - 20:00', slot: '저녁', title: cityFoods[1] ? `${cityFoods[1].name} 만찬` : '현지 시그니처 디너', loc: '현지 번화가', desc: cityFoods[1] ? `${cityFoods[1].cat} 전문점. ${cityFoods[1].must}` : '시원한 현지 생맥주/음료와 함께하는 푸짐한 저녁.' },
          { time: '20:30 - 22:30', slot: '야경/나이트', title: `${city.nameKo} 야경 산책 & 편의점 털기`, loc: '도심 야경 스팟', desc: '도시의 화려한 밤거리 감상 및 숙소 복귀 전 현지 푸딩/과일 야식 구매.' }
        ]
      });

      // Day 2
      days.push({
        dayNumber: 2,
        theme: `${state.itineraryStyle === 'gourmet' ? '식도락 미식' : state.itineraryStyle === 'healing' ? '온천 & 힐링' : '핵심 명소'} 완전 정복`,
        area: '도심 문화구역 ➔ 감성 카페 ➔ 선셋 뷰포인트',
        budget: '약 55,000원',
        items: [
          { time: '09:00 - 11:30', slot: '오전', title: `${city.highlights[1] || '오전 랜드마크'} 탐방`, loc: '문화 유적/공원', desc: '오전의 상쾌한 공기와 함께 여유롭게 감상하는 대표 명소.' },
          { time: '12:00 - 13:30', slot: '점심/오후', title: '로컬 별미 런치 & 스페셜티 카페', loc: '맛집 골목', desc: '현지인들이 줄 서는 오리지널 면요리 또는 덮밥 맛집 탐방.' },
          { time: '14:30 - 17:30', slot: '늦은오후', title: `${city.highlights[2] || '오후 핵심 코스'} & 쇼핑`, loc: '쇼핑 아케이드/갤러리', desc: '동선 꼬임 없이 도보 15분 이내로 연결되는 알찬 오후 코스.' },
          { time: '18:30 - 21:00', slot: '저녁', title: '야경 뷰포인트 레스토랑 또는 전통 이자카야/포차', loc: '시내 전망 레스토랑', desc: '하루를 마무리하는 낭만적인 저녁 식사.' }
        ]
      });

      // Day 3
      if (numDays >= 3) {
        const isLast = numDays === 3;
        days.push({
          dayNumber: 3,
          theme: isLast ? `아쉬운 작별 & ${depName} 안전 귀국` : '근교 감성 당일치기 투어',
          area: isLast ? '마트 쇼핑 ➔ 체크아웃 ➔ 공항' : '도심 외곽 명소 투어',
          budget: isLast ? '약 30,000원' : '약 65,000원',
          items: isLast ? [
            { time: '09:30 - 11:30', slot: '오전', title: '마지막 로컬 조식 & 특산품 면세 쇼핑', loc: '대형마트 / 돈키호테 / 까르푸', desc: '지인과 가족을 위한 인기 과자, 소스, 면세 쇼핑.', tip: '면세 혜택을 위해 여권 원본 필수 지참!' },
            { time: '12:00 - 13:30', slot: '점심/오후', title: '라스트 런치 & 공항 이동', loc: '시내 중심가', desc: '가장 맛있었던 메뉴 한 번 더 먹기.' },
            { time: '14:30 - 19:30', slot: '늦은오후', title: `공항 출국 ➔ ${depName} 도착`, loc: `${city.nameKo} 공항 ➔ ${depName}`, desc: '비행기 탑승 및 영남권 공항 도착 후 안전 귀가.' }
          ] : [
            { time: '09:00 - 13:00', slot: '오전', title: `${city.highlights[3] || '근교 자연 투어'}`, loc: '근교 명소', desc: '도심을 벗어나 만나는 이국적인 풍경.' },
            { time: '13:00 - 14:30', slot: '점심/오후', title: '근교 향토 정식 점심', loc: '현지 로컬 식당', desc: '지역 특산 식재료로 만드는 전통 요리.' },
            { time: '18:30 - 21:00', slot: '저녁', title: '마지막 밤 페어웰 디너', loc: '로컬 시그니처 식당', desc: '여행의 추억을 나누며 즐기는 푸짐한 만찬.' }
          ]
        });
      }

      // Day 4 & Day 5
      if (numDays >= 4) {
        days.push({
          dayNumber: 4,
          theme: numDays === 4 ? `기념품 쇼핑 & ${depName} 귀국` : '로컬 골목길 산책 & 힐링 스파',
          area: numDays === 4 ? '도심 ➔ 공항 귀국' : '감성 카페 & 스파',
          budget: '약 35,000원',
          items: [
            { time: '10:00 - 12:30', slot: '오전', title: '감성 골목길 산책 & 로컬 베이커리', loc: '골목 카페', desc: '여유롭게 즐기는 브런치와 커피 한 잔.' },
            { time: '13:30 - 18:00', slot: '점심/오후', title: numDays === 4 ? `공항 이동 및 ${depName} 귀국` : '온천/스파 체험', loc: '도심', desc: '휴식과 충전의 시간.' }
          ]
        });
      }

      state.currentPlan = {
        title: `${city.nameKo} ${numDays - 1}박 ${numDays}일 ${state.itineraryStyle === 'gourmet' ? '식도락 미식' : '알찬 핵심'} 여행`,
        cityId: state.cityId,
        departureAirport: state.departureAirport,
        durationDays: numDays,
        days: days,
        budgetEst: (flight ? flight.price : 200000) + numDays * 85000,
        notes: `${depName} 출발 최적화 일정. 현지 날씨: ${weather.cond} (${weather.temp}°C). ${weather.clothing}`
      };
    }

    /* ========================================================
       5. VIEW RENDERERS
       ======================================================== */
    function renderCityBar() {
      const container = document.getElementById('city-buttons-container');
      const label = document.getElementById('selected-city-label');
      const flags = { '일본': '🇯🇵', '대만': '🇹🇼', '베트남': '🇻🇳' };
      const current = getCurrentCity();

      label.innerHTML = `선택: <strong class="text-blue-300">${flags[current.country]} ${current.nameKo} (${current.nameEn})</strong>`;

      container.innerHTML = CITIES.map(c => {
        const isSel = c.id === state.cityId;
        return `
          <button onclick="selectCity('${c.id}')" class="flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 border ${
            isSel
              ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold border-blue-400 shadow-md'
              : 'bg-slate-800/80 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'
          }">
            <span>${flags[c.country]}</span>
            <span>${c.nameKo}</span>
            <span class="text-[10px] px-1 py-0.2 rounded ${isSel ? 'bg-blue-900/50 text-blue-200' : 'text-slate-400'}">
              ${c.country === '일본' ? 'JP' : c.country === '대만' ? 'TW' : 'VN'}
            </span>
          </button>
        `;
      }).join('');
    }

    function renderView() {
      switch (state.tab) {
        case 'flights': renderFlightsView(); break;
        case 'itinerary': renderItineraryView(); break;
        case 'restaurants': renderRestaurantsView(); break;
        case 'exchange': renderExchangeView(); break;
        case 'records': renderRecordsView(); break;
      }
    }

    function promptAddSpot() {
      const title = prompt('추가할 여행 코스 제목을 입력하세요 (예: 텐진 다이묘거리 빈티지숍):');
      if (!title) return;
      const desc = prompt('상세 내용 또는 팁을 입력하세요:', '자유 일정');

      const plan = state.currentPlan;
      if (plan && plan.days[state.activeDayIdx]) {
        plan.days[state.activeDayIdx].items.push({
          time: '자유 시간',
          slot: '늦은오후',
          title: title,
          loc: '사용자 추가 코스',
          desc: desc || '',
          tip: ''
        });
        renderItineraryView();
        showToast('장소가 성공적으로 추가되었습니다!');
      }
    }

    function deleteItineraryItem(dayIdx, itemIdx) {
      if (state.currentPlan && state.currentPlan.days[dayIdx]) {
        state.currentPlan.days[dayIdx].items.splice(itemIdx, 1);
        renderItineraryView();
      }
    }

        ],

        createdAt: new Date().toISOString().split('T')[0]

      state.savedRecords.unshift(newRec);
      saveRecordsToLocalStorage();
      showToast('🎉 내 여행 기록함에 성공적으로 저장되었습니다!');

              </div>
              <div class="mt-3 text-xs text-emerald-900 font-medium">
                💳 <strong>추천 카드:</strong> ${activeRate.card}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- 5. Records View ---
    function renderRecordsView() {
      const records = state.savedRecords;

      document.getElementById('view-records').innerHTML = `
        <div class="bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 rounded-2xl p-6 text-white shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl sm:text-3xl font-extrabold flex items-center gap-2">
              📓 나의 여행 기록함 & 가계부
            </h2>
            <p class="mt-1 text-purple-100 text-xs sm:text-sm">
              저장된 일정, 체크리스트, 현지 지출 내역을 브라우저에 영구 보관하고 언제든 확인하세요.
            </p>
          </div>
          <button onclick="downloadSelfHtml()" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition-all">
            📥 단독 HTML 가이드북 다운로드
          </button>
        </div>

        <div class="mt-6 space-y-6">
          ${records.map((rec, rIdx) => `
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-200">
                <div>
                  <span class="text-xs font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-800">
                    ${rec.departureAirport === 'TAE' ? '대구공항 출발' : '부산 김해공항 출발'}
                  </span>
                  <h3 class="text-lg font-black text-slate-900 mt-1">${rec.title}</h3>
                  <span class="text-xs text-slate-400">${rec.dateRange}</span>
                </div>
                <button onclick="deleteRecord(${rIdx})" class="text-xs text-rose-500 hover:underline">
                  기록 삭제 ✕
                </button>
              </div>

              <!-- Checklist Grid -->
              <div class="mt-4">
                <span class="text-xs font-bold text-slate-700 block mb-2">✅ 준비물 체크리스트:</span>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  ${rec.checklist.map((c, cIdx) => `
                    <div onclick="toggleChecklist(${rIdx}, ${cIdx})" class="p-2.5 rounded-lg border text-xs flex items-center justify-between cursor-pointer ${
                      c.done ? 'bg-slate-50 text-slate-400 line-through' : 'bg-white text-slate-800 hover:border-emerald-300'
                    }">
                      <span>${c.done ? '☑️' : '⬜'} ${c.task}</span>
                      <span class="text-[10px] text-slate-400">[${c.cat}]</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Expenses -->
              <div class="mt-4 pt-3 border-t border-slate-100">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold text-slate-700">💰 여행 경비 지출 내역:</span>
                  <span class="text-xs font-black text-amber-600">
                    총 ${rec.expenses.reduce((s, e) => s + e.krw, 0).toLocaleString()}원
                  </span>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs">
                    <thead>
                      <tr class="text-slate-400 border-b">
                        <th class="py-1">구분</th>
                        <th class="py-1">항목</th>
                        <th class="py-1">현지 금액</th>
                        <th class="py-1 text-right">원화 환산</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${rec.expenses.map(e => `
                        <tr>
                          <td class="py-1.5"><span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${e.cat}</span></td>
                          <td class="py-1.5 font-medium text-slate-800">${e.desc}</td>
                          <td class="py-1.5 text-slate-600">${e.local.toLocaleString()} ${e.cur}</td>
                          <td class="py-1.5 text-right font-bold text-slate-900">${e.krw.toLocaleString()}원</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleChecklist(recordIdx, checkIdx) {
      const rec = state.savedRecords[recordIdx];
      if (rec && rec.checklist[checkIdx]) {
        rec.checklist[checkIdx].done = !rec.checklist[checkIdx].done;
        saveRecordsToLocalStorage();
        renderRecordsView();
      }
    }

    function deleteRecord(recordIdx) {
      if (confirm('이 여행 기록을 삭제하시겠습니까?')) {
        state.savedRecords.splice(recordIdx, 1);
        saveRecordsToLocalStorage();
        renderRecordsView();
      }
    }

    /* ========================================================
       6. STANDALONE HTML DOWNLOAD UTILITY
       ======================================================== */
    function downloadSelfHtml() {
      // Clones current document HTML
      const htmlContent = document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `트래블메이트_영남출발_아시아여행_단독가이드북.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📥 빌드 없이 바로 열 수 있는 단독 HTML 파일이 다운로드되었습니다!');
    }

    /* ========================================================
       7. INITIALIZATION
       ======================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      renderCityBar();
      generateItinerary();
      renderFlightsView();
    });
  </script>
</body>
</html>
