<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아시아 해외여행 플래너 (대구·부산 출발) - Standalone</title>
  <base href="./">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-title">
        <span>✈</span>
        <span>동아시아 해외여행 플래너 (대구·부산 출발)</span>
      </div>
      <div class="header-desc">
        별도의 빌드나 설치 없이 브라우저에서 바로 실행 가능한 단독형(Standalone) 플래너입니다.
        일본, 대만, 베트남, 상하이 주요 도시 항공권 최저가 TOP 3, 환율 그래프, 일정 및 맛집, 기상 정보 제공.
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button id="tab-flights" class="tab-btn active" onclick="switchTab('flights')">1. 항공권 금액분석 (TOP 3 & 과거 1년)</button>
      <button id="tab-currency" class="tab-btn" onclick="switchTab('currency')">2. 각 국가별 환율 그래프 (최근 1달)</button>
      <button id="tab-itinerary" class="tab-btn" onclick="switchTab('itinerary')">3. 여행계획 & 맛집 추천</button>
      <button id="tab-news" class="tab-btn" onclick="switchTab('news')">4. 여행관련 뉴스 및 기상정보</button>
    </div>

    <!-- Main Content Area -->
    <div id="tab-content">
      <!-- Dynamic rendering via app.js -->
    </div>

    <div class="footer">
      © 2026 동아시아 해외여행 플래너 · 대구(TAE)·부산(PUS) 출발 맞춤 · Standalone Edition
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
